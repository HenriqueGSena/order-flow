spring:
  application:
    name: order-flow
  datasource:
    url: jdbc:mysql://localhost:3306/orderflow
    username: orderflow
    password: orderflow
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/master.xml
    enabled: true
  rabbitmq:
    host: localhost
    port: 5672
    username: orderflow
    password: orderflowdev
server:
  port: 8080
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
  api-docs:
    path: /v3/api-docs
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
