spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/orderflow_test}
    username: ${DB_USERNAME:orderflow}
    password: ${DB_PASSWORD:orderflow}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  liquibase:
    enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:orderflow}
    password: ${RABBITMQ_PASSWORD:orderflowdev}
